<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="KStore">
  <title>KStore</title>
  <defs>
    <linearGradient id="kGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F6C63C" />
      <stop offset="0.45" stop-color="#FFD75E" />
      <stop offset="1" stop-color="#E2A81B" />
    </linearGradient>
    <linearGradient id="kSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F3F5" />
      <stop offset="0.55" stop-color="#D5D8DE" />
      <stop offset="1" stop-color="#AFB5BE" />
    </linearGradient>
    <linearGradient id="kStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C948" />
      <stop offset="1" stop-color="#E3A315" />
    </linearGradient>
    <linearGradient id="kScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6" />
      <stop offset="1" stop-color="#F3EFE3" />
    </linearGradient>
  </defs>

  <g>
    <!-- orbit arc behind the phone -->
    <ellipse cx="230" cy="168" rx="168" ry="58" transform="rotate(-16 230 168)"
             fill="none" stroke="url(#kStroke)" stroke-width="7" opacity="0.55" />

    <!-- phone body -->
    <g transform="rotate(-11 175 152)">
      <rect x="112" y="36" width="126" height="232" rx="26"
            fill="url(#kScreen)" stroke="url(#kStroke)" stroke-width="8" />
      <rect x="152" y="52" width="46" height="7" rx="3.5" fill="#E9C463" opacity="0.85" />
      <rect x="150" y="246" width="50" height="6" rx="3" fill="#E9C463" opacity="0.7" />
    </g>

    <!-- K -->
    <text x="128" y="214" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="196" font-weight="800" fill="url(#kGold)" letter-spacing="-8">K</text>

    <!-- Store -->
    <text x="292" y="206" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="166" font-weight="500" fill="url(#kSilver)" letter-spacing="-6">Store</text>
  </g>

  <!-- tagline -->
  <g opacity="0.95">
    <line x1="196" y1="262" x2="300" y2="262" stroke="#E3A315" stroke-width="2" opacity="0.6" />
    <text x="308" y="268" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif"
          font-size="19" font-weight="600" fill="#E3A315" letter-spacing="7">PHONE &amp; ACCESSORIES</text>
    <line x1="596" y1="262" x2="628" y2="262" stroke="#E3A315" stroke-width="2" opacity="0.6" />
  </g>
</svg>
